name: WerrSoma Scientific CI & Benchmark Replication

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  scientific-benchmarks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute 6 Empirical Biophysical Protocols
      run: |
        python run_scientific_experiments.py

    - name: Verify Phase Transitions & Attractor Stability
      run: |
        python test_bioneural_phases.py

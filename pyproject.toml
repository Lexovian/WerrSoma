[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "werrsoma"
version = "1.0.0"
authors = [
  { name = "Dağhan Dağlı", email = "daghan@pcworm.net" },
  { name = "Volkan Dağlı", email = "ask@answerr.me" },
  { name = "Zerrin Dağlı" }
]
description = "Bio-Synthetic Neuromorphic Interfacing: In Silico Integration of a Zero-Memory Fractal Decision Engine with the Whole-Brain Drosophila Melanogaster Connectome"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "drosophila", "connectome", "flywire", "neuromorphic",
  "brain-computer-interface", "werr", "mandelbrot", "bio-resonance"
]
dependencies = [
  "numpy>=1.22.0",
  "Pillow>=9.0.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent"
]

[project.urls]
"Homepage" = "https://lexovian.pcworm.net/"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.22996626"
"Repository" = "https://github.com/Lexovian/WerrSoma"
